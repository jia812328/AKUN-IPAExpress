<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title size="large">设置</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding-top">
  <div class="page-header">
    <h1>设置</h1>
    <p>AKUN 应用配置</p>
  </div>

  <!-- 外观 -->
  <div class="glass-card" style="margin: 0 20px 16px; padding: 20px;">
    <h3 style="font-size: 15px; font-weight: 600; margin: 0 0 16px 0; color: var(--ion-text-color);">外观</h3>
    <ion-item lines="full" style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
      <ion-label style="font-size: 14px; font-weight: 500;">深色模式</ion-label>
      <ion-select [(ngModel)]="darkMode" (ionChange)="changeDarkMode($event)" slot="end" style="font-size: 14px;" interface="popover">
        <ion-select-option value="system">跟随系统</ion-select-option>
        <ion-select-option value="light">浅色</ion-select-option>
        <ion-select-option value="dark">深色</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item lines="none" style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
      <ion-label style="font-size: 14px; font-weight: 500;">图标风格</ion-label>
      <span slot="end" style="font-size: 14px; color: var(--ion-color-medium);">iOS 26 液态玻璃</span>
    </ion-item>
  </div>

  <!-- 文件管理 -->
  <div class="glass-card" style="margin: 0 20px 16px; padding: 20px;">
    <h3 style="font-size: 15px; font-weight: 600; margin: 0 0 16px 0; color: var(--ion-text-color);">文件管理</h3>
    <ion-item lines="full" style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
      <ion-label style="font-size: 14px; font-weight: 500;">显示隐藏文件</ion-label>
      <ion-toggle [(ngModel)]="showHiddenFiles" slot="end"></ion-toggle>
    </ion-item>
    <ion-item lines="none" style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
      <ion-label style="font-size: 14px; font-weight: 500;">文件列表排序</ion-label>
      <ion-select [(ngModel)]="fileSort" slot="end" style="font-size: 14px;" interface="popover">
        <ion-select-option value="name">按名称</ion-select-option>
        <ion-select-option value="date">按日期</ion-select-option>
        <ion-select-option value="size">按大小</ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <!-- 存储 -->
  <div class="glass-card" style="margin: 0 20px 16px; padding: 20px;">
    <h3 style="font-size: 15px; font-weight: 600; margin: 0 0 16px 0; color: var(--ion-text-color);">存储</h3>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 14px; color: var(--ion-text-color);">缓存大小</span>
      <span style="font-size: 14px; color: var(--ion-color-medium);">12.5 MB</span>
    </div>
    <ion-item lines="full" style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
      <ion-label style="font-size: 14px; font-weight: 500;">签名后自动清理临时文件</ion-label>
      <ion-toggle [(ngModel)]="autoCleanTemp" slot="end"></ion-toggle>
    </ion-item>
    <ion-button expand="block" fill="outline" size="small" (click)="clearCache()" style="--border-radius: 20px;">
      清除缓存
    </ion-button>
  </div>

  <!-- 关于 -->
  <div class="glass-card" style="margin: 0 20px 16px; padding: 20px;">
    <h3 style="font-size: 15px; font-weight: 600; margin: 0 0 16px 0; color: var(--ion-text-color);">关于</h3>
    <ion-item lines="full" style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
      <ion-label style="font-size: 14px; font-weight: 500;">应用名称</ion-label>
      <span slot="end" style="font-size: 14px; color: var(--ion-color-medium);">AKUN</span>
    </ion-item>
    <ion-item lines="full" style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
      <ion-label style="font-size: 14px; font-weight: 500;">版本</ion-label>
      <span slot="end" style="font-size: 14px; color: var(--ion-color-medium);">1.0.0</span>
    </ion-item>
    <ion-item lines="none" style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
      <ion-label style="font-size: 14px; font-weight: 500;">开发者</ion-label>
      <span slot="end" style="font-size: 14px; color: var(--ion-color-medium);">AKUN Team</span>
    </ion-item>
  </div>

  <div style="text-align: center; padding: 20px; font-size: 12px; color: var(--ion-color-medium);">
    AKUN · 优雅自签工具
  </div>
</ion-content>
