name: 编译 AKUN IPA

on:
  workflow_dispatch:  # 手动触发，点一下按钮就行

jobs:
  build:
    runs-on: macos-latest  # GitHub 提供的免费 Mac 虚拟机

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          npm install
          npm install @capacitor/ios

      - name: 构建 Web 资源
        run: npx ng build

      - name: 同步 iOS 项目
        run: npx cap sync ios

      - name: 编译未签名 IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath archive App
          mkdir -p Payload
          mv archive.xcarchive/Products/Applications/App.app Payload/
          zip -r AKUN.ipa Payload/
          mv AKUN.ipa ../../

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AKUN-未签名IPA
          path: AKUN.ipa