name: 编译 AKUN IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: |
          npm install
          npm install @capacitor/ios

      - name: 构建 Web 资源
        run: npx ng build

      - name: 复制 Web 资源到 iOS 项目
        run: npx cap copy ios

      - name: 编译未签名 IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath archive.xcarchive archive
          mkdir -p Payload
          cp -r archive.xcarchive/Products/Applications/App.app Payload/
          zip -r AKUN.ipa Payload/
          mv AKUN.ipa ../../

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AKUN-未签名IPA
          path: AKUN.ipa
